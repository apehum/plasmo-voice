name: Publish PR Snapshot

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened

jobs:
  mic-helper:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Import the signing certificate
      id: signing
      env:
        CERTIFICATE: ${{ secrets.MACOS_SIGNING_P12 }}
        CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      run: |
        if [ -z "$CERTIFICATE" ]; then
          echo "::warning::no signing certificate, the helper will be signed ad-hoc and the microphone grant will not survive an update."
          exit 0
        fi

        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        CERTIFICATE_FILE="$RUNNER_TEMP/certificate.p12"
        trap 'rm -f "$CERTIFICATE_FILE"' EXIT

        echo "$CERTIFICATE" | base64 -d > "$CERTIFICATE_FILE"
        security create-keychain -p "" "$KEYCHAIN"
        security set-keychain-settings "$KEYCHAIN"
        security unlock-keychain -p "" "$KEYCHAIN"
        security import "$CERTIFICATE_FILE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

        IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | grep -o '[0-9A-F]\{40\}' | head -1)
        if [ -z "$IDENTITY" ]; then
          echo "::error::the certificate holds no code signing identity."
          exit 1
        fi
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

    - name: Build the microphone helper
      run: ./gradlew :macos:helper:bundleZip --stacktrace -Psnapshot=true -Ppv.mac.signIdentity="${{ steps.signing.outputs.identity }}"

    - name: Upload the bundle
      uses: actions/upload-artifact@v4
      with:
        name: mic-helper
        path: macos/helper/build/distributions/PVMicHelper.zip
        if-no-files-found: error

  discover:
    runs-on: ubuntu-latest
    outputs:
      client-variants: ${{ steps.list.outputs.variants }}

    steps:
    - uses: actions/checkout@v6
    - name: List client variants
      id: list
      run: |
        variants=$(find client -mindepth 1 -maxdepth 1 -type d -name '*-*' -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')
        echo "variants=$variants" >> "$GITHUB_OUTPUT"

  build-client:
    needs: [discover, mic-helper]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.discover.outputs.client-variants) }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-read-only: false

    - name: Download the microphone helper
      uses: actions/download-artifact@v8.0.1
      with:
        name: mic-helper
        path: build/mic-helper

    - name: Build ${{ matrix.variant }} with Gradle
      run: ./gradlew ":client:${{ matrix.variant }}:build" --stacktrace -Psnapshot=true -Ppv.mac.helperZip="$GITHUB_WORKSPACE/build/mic-helper/PVMicHelper.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: jars-client-${{ matrix.variant }}
        path: build/libs/
        retention-days: 7

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-read-only: false

    - name: Build with Gradle (everything except client)
      run: |
        excludes=()
        for variant in $(echo '${{ needs.discover.outputs.client-variants }}' | jq -r '.[]'); do
          excludes+=("-x" ":client:${variant}:build")
        done
        ./gradlew build "${excludes[@]}" --stacktrace -Psnapshot=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: jars-server-proxy
        path: build/libs/
        retention-days: 7

  registry-upload:
    needs: [build-client, build]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        pattern: jars-*
        path: build/libs/
        merge-multiple: true

    - name: Upload to Registry
      uses: plasmoapp/actions/.github/actions/upload-to-registry@main
      with:
        registry_url: ${{ secrets.REGISTRY_URL }}
        upload_token: ${{ secrets.REGISTRY_UPLOAD_TOKEN }}
        message: ${{ github.event.head_commit.message }}
